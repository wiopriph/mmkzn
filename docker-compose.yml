# Прод на Beget VPS: Caddy (TLS, 80/443) → app (Nuxt node-server, :3000).
# Секреты — в .env рядом с этим файлом (образец: .env.example).
# Postgres появится третьим сервисом на Этапе 1-доп (история заявок).
services:
  app:
    # прод тянет готовый образ из GHCR (собирает GitHub Actions);
    # build оставлен для локальной сборки и аварийного fallback
    image: ghcr.io/wiopriph/mmkzn:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # docker-сеть без IPv6, а DNS отдает AAAA первым (Telegram API
      # уходил в connect timeout) - заставляем node ходить по IPv4
      NODE_OPTIONS: --dns-result-order=ipv4first
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
