# Контент главной страницы (редизайн по макету Figma «NY 90»).
# SEO-мета переписана вместе с редизайном (решение владельца, 2026-09-12);
# прежняя Yoast-мета лежит в data/extracted/seo-map.json, переопределение
# зафиксировано в data/seo-overrides.json.
seo:
  title: Нерудные материалы в Казани — песок, гравий, щебень, ОПГС | МируМир
  description: Добыча, хранение и отгрузка нерудных материалов в Татарстане.
    Песок речной и обогащенный, гравий, щебень, ОПГС с сертификатами ГОСТ.
    Собственная лаборатория, доставка до объекта.
  ogImage: /design/photo-hero.jpg

hero:
  title: Добыча, хранение и отгрузка
  subtitle: нерудных материалов в Татарстане
  cta: Получить прайс
  image:
    src: /design/photo-hero.jpg
    alt: Погрузка нерудных материалов конвейером на баржу
  # фоновое видео с Портовой: крутится без звука, клик по play включает звук;
  # экранам уже 768px отдаётся лёгкая 720p-версия
  video: /video/hero.mp4
  videoMobile: /video/hero-720.mp4

# Цифры компании — из макета; клиент должен подтвердить (см. DECISIONS.md)
infra:
  title: Инфраструктура как единая система
  note: От карьера до объекта заказчика — без посредников на каждом этапе
  stats:
    - label: Площадь карьера, Га
      value: "32"
    - label: Площадь складирования, Га
      value: "94"
    - label: Тонн отгрузки материалов ежедневно
      value: "500+"
    - label: Единиц техники
      value: "90+"

products:
  title: Продукция
  # «доставки материалов» — ссылка (в макете подчёркнута); страница доставки
  # появится на Этапе 5, пока ведёт на форму диалога
  introBefore: Актуальные цены на весь ассортимент с учетом НДС на условиях
    самовывоза. Имеем возможность
  introLink: доставки материалов
  introLinkTo: "/#dialog"
  introAfter: до объекта заказчика
  cta: Вся продукция
  # фото карточек из макета; порядок перечисления = порядок карточек на главной
  photos:
    gravij-frakczionnyj-20: /design/photo-gravij-20.jpg
    gravij-frakczionnyj-5-20: /design/photo-gravij-5-20.jpg
    opgs: /design/photo-opgs.jpg
    pesok-rechnoj: /design/photo-pesok.jpg

trust:
  title: Нам доверяют объёмы
  # «собственная лаборатория» — ссылка (в макете подчёркнута); страницы
  # лаборатории пока нет — ведёт на форму диалога
  textBefore: Каждая партия сопровождается сертификатом соответствия ГОСТ.
    Состав и характеристики материалов проверяет
  textLink: собственная лаборатория
  textLinkTo: "/#dialog"
  textAfter: — до отгрузки, а не по факту жалобы.
  facts:
    - value: "15"
      label: Лет поставок крупнейшим предприятиям региона
    - value: "940"
      label: тонн максимальный разовый объём поставки
    - value: ""
      label: На продукцию имеются все сертификаты соответствия

# фоновое видео секции крутится без звука (фото остаётся постером)
supply:
  title: Снабжаем
  subtitle: важные проекты региона
  image:
    src: /design/photo-supply.jpg
    alt: Портовые краны и баржа с нерудными материалами
  video: /video/supply.mp4

news:
  title: Новости
  intro: Обеспечиваем нерудными материалами крупные дорожные, строительные
    холдинги и производства
  cta: Все события

dialog:
  title: Приглашаем к диалогу
  # перенос строки после первого предложения — как в макете (white-space: pre-line)
  text: |-
    Серьезные проекты начинаются с крепкого рукопожатия.
    Мы готовы взять ответственность за поставку качественных нерудных материалов для вашего проекта.
  nameLabel: Имя
  phoneLabel: Телефон
  submit: Отправить заявку
  consent: Согласен(на) с политикой обработки персональных данных
