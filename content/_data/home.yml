seo:
  title: Нерудные строительные материалы в Казани - ООО "МируМир"
  description: "ООО «МИРУМИР» является логистической структурой,
    специализирующейся в обеспечении нерудными материалами: ОПГС, песок речной и
    обогащенный, фракционные гравий и щебень."
hero:
  title: Нерудные строительные материалы
  image:
    src: /legacy/media/mirumir.jpg
    alt: Погрузка нерудных материалов в речном порту
about:
  title: О нас
  text: ООО «МИРУМИР» является логистической структурой, специализирующейся в
    обеспечении нерудными материалами крупных дорожных, строительных холдингов и
    производств.
services:
  title: Наши услуги
  intro: "Основными видами деятельности предприятия являются:"
  items:
    - title: Транспортная обработка грузов
      text: включая погрузочно-разгрузочную деятельность на водном транспорте
      icon: /legacy/media/harbor-crane-1.png
      link: "#form"
    - title: Хранение и складирование
      text: хранение и складирование
      icon: /legacy/media/excavator.png
      link: "#form"
    - title: Оптовая и розничная торговля
      text: нерудными строительными материалами
      icon: /legacy/media/dump-truck.png
      link: "#price"
advantages:
  title: "Наши преимущества:"
  items:
    - Имеем возможность оказывать услуги перевозки материалов автотранспортом в
      максимально короткие сроки;
    - Гарантируем своевременное и полное выполнение всех договорных обязательств
      перед своими партнерами;
    - Проводим гибкую ценовую политику в соответствии с объемами, формами оплаты
      и запросами наших Покупателей.
