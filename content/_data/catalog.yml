# Контент страницы каталога (/nasha-produkcziya/), макет Figma "NY 90", раздел "КАТАЛОГ".
# Цены и характеристики сюда не дублируются - они живут в content/materials.

hero:
  title: Каталог нерудных материалов
  text: |-
    Все в наличии на складе в Казани.
    Цены ниже указаны за тонну, безналичный расчёт, с НДС 22%, актуальны на 2026 год.
  # страница подменяет ссылку на #selector; на форму кнопка ведет, только если подборщик скрыт
  cta:
    label: Подобрать под мою задачу
    to: "#dialog"
  # фон - видео со склада (постер = первый кадр); экранам уже 768px - легкая 720p-версия.
  # В десктопном макете фон был плоской синей заливкой
  image:
    src: /design/catalog/hero-poster.jpg
    alt: Сортировочная установка и погрузчик на складе нерудных материалов
  video: /video/catalog-hero.mp4
  videoMobile: /video/catalog-hero-720.mp4

products:
  # порядок перечисления = порядок карточек; ключ - legacyPath материала без слешей
  photos:
    gravij-frakczionnyj-20: /design/catalog/gravij-20.jpg
    gravij-frakczionnyj-5-20: /design/catalog/gravij-5-20.jpg
    opgs: /design/catalog/opgs.jpg
    pesok-rechnoj: /design/catalog/pesok-rechnoj.jpg
    pesok-obogashhennyj-modul-krupnosti-ot-22-28: /design/catalog/pesok-obogashhennyj.jpg

selector:
  # тексты копирайтера опубликованы как есть, технолог клиента их еще не утверждал.
  # Скрыть блок с прода: добавить draft: true (останется виден в dev)
  title: Подобрать под задачу
  text: Выберите, что вы делаете. Покажем материал, цену и когда он не подойдёт.
  priceNote: безнал, с НДС 22%
  labels:
    with: Добавьте
    alt: Вместо него
    not: Не подойдёт, если
  pageLabel: На страницу материала
  # калькулятора на сайте пока нет - кнопка ведет на форму
  calcLabel: Посчитать объём
  # material - legacyPath материала без слешей; задача без material показывает fallback
  tasks:
    - name: Основание под дороги и площадки
      hint: Парковки, проезды, склады
      material: opgs
      why: Крупные зёрна гравия держат нагрузку, песок заполняет пустоты между ними. Поэтому смесь хорошо уплотняется.
      with: Гравий 20+ как нижний слой, если основание глубокое
      not: Для бетона нужны отдельные песок и гравий.
    - name: Засыпка и подсыпка
      hint: Под плитку, фундамент, планировка участка
      material: pesok-rechnoj
      why: Для засыпок не нужен контролируемый состав, а речной песок самый доступный в каталоге.
      alt: ОПГС, если сверху будет нагрузка
      not: Если по слою будет ездить техника, берите ОПГС.
    - name: Бетон, раствор, стяжка
      hint: Фундаменты, стяжка пола, кладочные растворы
      material: pesok-obogashhennyj-modul-krupnosti-ot-22-28
      why: У обогащённого песка стабильнее состав, а для бетонов и растворов это важно.
      with: Гравий 5–20 как крупный заполнитель для бетона
      not: "Для массовой засыпки он избыточен: хватит речного песка."
    - name: Дренаж и фильтрующий слой
      hint: Вокруг фундамента, под отмостку, водоотвод
      material: gravij-frakczionnyj-20
      why: Между крупными зёрнами остаются пустоты, по которым вода уходит из слоя.
      alt: Гравий 5–20 для более мелкого слоя
      not: Точную фракцию часто задаёт проект, сверьтесь с ним.
    - name: Обратная засыпка траншей
      hint: Коммуникации, кабель, трубы
      material: opgs
      why: Смесь хорошо уплотняется, а значит просадок будет меньше.
      alt: Песок речной, если нагрузки на засыпку нет
      not: Материал засыпки коммуникаций нередко прописан в проекте или ТУ.
    - name: Дорожки и ландшафт
      hint: Садовые дорожки, отсыпка, оформление участка
      material: gravij-frakczionnyj-5-20
      why: Окатанный гравий средней фракции удобно отсыпать, и он выглядит аккуратно.
      not: Для основания под нагрузкой нужен ОПГС.
    - name: Моей задачи здесь нет
      hint: Опишите задачу, наш технолог подскажет
  fallback:
    title: Опишите её
    text: Напишите, что строите и в каком объёме. Технолог подберёт материал и посчитает стоимость. Вам не придётся выбирать наугад.
    cta: Описать задачу

video:
  image:
    src: /design/catalog/band-poster.jpg
    alt: Погрузчик загружает самосвал на складе нерудных материалов
  video: /video/catalog-band.mp4
  videoMobile: /video/catalog-band-720.mp4

steps:
  title: |-
    От выбора материала
    до отгрузки
  note: |-
    Стоимость назовём по адресу и объёму,
    до выставления счёта.
  cta:
    label: Рассчитать с доставкой
    href: "#dialog"
  items:
    - title: Выберите материал
      caption: Цены и наличие в каталоге.
    # в макете "В калькуляторе, по телефону или в форме" - калькулятора на сайте пока нет
    - title: Назовите объём и адрес
      caption: По телефону или в форме.
    - title: Получите счёт
      caption: |-
        Безналичный расчёт,
        цена с НДС 22%.
    - title: Получите отгрузку
      caption: С документами на партию.

passport:
  title: |-
    Каждая партия
    с паспортом
  text: Выберите материал, чтобы увидеть образец
  heading: Паспорт качества
  normLabel: Нормативный документ
  moreLabel: Все характеристики
  # вкладки в порядке макета; у каждого материала свой набор строк лабораторной
  # таблицы (по началу названия параметра). Материалы без таблицы пропускаются
  materials:
    opgs:
      - Содержание гравия
      - Содержание пылевидных и глинистых частиц
      - Влажность
      - Насыпная плотность
    gravij-frakczionnyj-20:
      - Марка прочностных показателей
      - Марка по морозостойкости
      - Содержание пылевидных и глинистых частиц
      - Насыпная плотность
    gravij-frakczionnyj-5-20:
      - Марка прочностных показателей
      - Марка по морозостойкости
      - Содержание пылевидных и глинистых частиц
      - Насыпная плотность
    pesok-rechnoj:
      - Модуль крупности
      - Содержание пылевидных и глинистых частиц
      - Влажность
      - Насыпная плотность
    pesok-obogashhennyj-modul-krupnosti-ot-22-28:
      - Модуль крупности
      - Содержание пылевидных и глинистых частиц
      - Влажность
      - Насыпная плотность

faq:
  # тексты копирайтера опубликованы как есть: в квадратных скобках - пропуски,
  # которые заполняет клиент. Скрыть блок с прода: добавить draft: true
  title: Часто задаваемые вопросы
  # телефон отдела снабжения подставляется из contacts.yml
  text: |-
    Не нашли свой вопрос? Позвоните
    в отдел снабжения по номеру
  items:
    - question: Какая минимальная партия?
      answer:
        - Минимальная партия [N] т. Меньшие объёмы [возможны по запросу / не отгружаем].
    - question: Как считается доставка?
      answer:
        - Доставка [включена в цену / считается отдельно]. Стоимость называем по адресу и объёму до выставления счёта, без сюрпризов в итоговой сумме.
    - question: |-
        Цены указаны с НДС?
        Можно ли без НДС или за наличные?
      answer:
        - Цены в каталоге указаны за тонну, безналичный расчёт, с НДС 22%.
        - "Условия без НДС и оплата наличными: [условия клиента]."
    - question: Чем ОПГС отличается от ПГС?
      answer:
        - "ПГС это природная песчано-гравийная смесь в том составе, в каком она добыта. ОПГС обогащённая: долю гравия доводят до нормируемой, поэтому состав стабильнее."
        - "Группа и содержание гравия указаны в паспорте: [из паспорта]."
    - question: Чем гравий отличается от щебня?
      answer:
        - Гравий это природный окатанный камень. Щебень получают дроблением горной породы, у него острые грани.
        - В нашем каталоге [гравий / гравий и щебень].
    - question: Какой материал брать для бетона?
      answer:
        - Для бетона обычно берут отдельные песок и гравий нужной фракции, а не готовую смесь. Подбор зависит от марки бетона, и в каталоге есть блок «Подобрать под задачу».
        - "Для сложных случаев: [консультация технолога]."
    - question: Чем песок речной отличается от обогащённого?
      answer:
        - Речной песок подходит для засыпок, подсыпок и благоустройства. Обогащённый имеет контролируемый состав, его выбирают для бетонов и растворов.
        - "Модуль крупности и содержание примесей: [из паспорта]."
    - question: Сколько тонн в кубометре?
      answer:
        - "Вес куба зависит от материала и влажности. Значения по нашим материалам: [таблица из паспортов]."
        - Калькулятор в каталоге считает ориентировочный вес. Итоговый вес определяют весы при отгрузке.
    - question: Как проверить, что привезли именно заказанное?
      answer:
        - К каждой партии идёт паспорт качества. При приёмке сверьте накладную, материал и вес с документами.
        - "Претензии принимаются в течение [N] дн., порядок: [как оформить]."
    - question: Работаете ли вы с частными лицами?
      answer:
        - "[Да, с минимальной партией N т / Нет, только юридические лица]."
