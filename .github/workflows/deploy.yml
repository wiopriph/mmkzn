# Деплой по push в master: линт -> сборка образа в CI -> push в GHCR ->
# сервер делает только pull и перезапуск (на VPS ничего не собирается).
# Секреты репозитория: DEPLOY_HOST (IP сервера), DEPLOY_SSH_KEY (приватный
# деплой-ключ, его публичная пара лежит на сервере).
name: deploy

on:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # lock хранит git-зависимость как git+ssh, у раннера нет ключей
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/wiopriph/mmkzn:latest
            ghcr.io/wiopriph/mmkzn:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/mmkzn
            git pull
            docker compose pull app
            docker compose up -d
            docker image prune -f
            sleep 5
            # smoke напрямую в app: https через caddy до переключения DNS
            # не работает (нет сертификата домена) и ронял джобу зря
            docker exec mmkzn-app-1 node -e "fetch('http://localhost:3000/').then(r => { if (r.status !== 200) process.exit(1); console.log('smoke ok'); })"
